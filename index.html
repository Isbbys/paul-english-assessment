<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>General English Assessment</title><style>body{font:16px system-ui;margin:3rem auto;max-width:650px;padding:1rem;color:#172033}progress{width:100%}</style></head><body><h2>Loading the English assessment…</h2><p>Please keep this page open.</p><progress></progress><script>(async()=>{try{const url='https://raw.githubusercontent.com/Isbbys/paul-english-assessment/main/assessment.html.gz.b64?'+Date.now();const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('Assessment file unavailable ('+r.status+').');const bytes=await r.arrayBuffer();const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<h2>Could not load assessment</h2><p>'+e.message+'</p><p>Please refresh this page shortly.</p>'}})();</script></body></html>
