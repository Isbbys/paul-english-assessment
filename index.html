<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>General English Assessment | ESL</title>
<style>
body{font:16px system-ui;margin:3rem auto;max-width:650px;padding:1rem;color:#172033}
progress{width:100%}
</style>
</head>
<body>
<h2>Loading the English assessment…</h2>
<p>Please keep this page open.</p>
<progress></progress>
<script>
(async()=>{
 try{
  const response=await fetch('./assessment.html.gz.b64');
  if(!response.ok) throw new Error('Unable to load assessment file ('+response.status+')');
  const compressed=await response.arrayBuffer();
  const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  document.open();document.write(html);document.close();
 }catch(error){
  document.body.innerHTML='<h2>Could not load assessment</h2><p>'+error.message+'</p><p>Please try again in a modern browser.</p>';
 }
})();
</script>
</body>
</html>
